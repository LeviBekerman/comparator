<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>פנקס · ספקים ולקוחות</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%82%AA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:      #F4F6FB;
    --paper-line: #E1E5F0;
    --surface:    #FFFFFF;
    --ink:        #181B2E;
    --ink-soft:   #555B78;
    --ink-faint:  #696E86;
    --brand:      #128173;
    --brand-ink:  #0D7769;
    --brand-soft: #D7F0EC;
    --coral:      #FF7A59;
    --coral-ink:  #C7300A;
    --coral-soft: #FFE4D9;
    --good:       #2D764E;
    --good-soft:  #E1F1E6;
    --warn:       #B4711B;
    --warn-ink:   #985B16;
    --warn-soft:  #FBEBD6;
    --bad:        #B23A3A;
    --bad-soft:   #FAE4E2;
    --chart-income:  #2A78D6;
    --chart-expense: #E34948;
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 22px;
    --shadow-sm: 0 2px 6px rgba(24,27,46,.06), 0 1px 2px rgba(24,27,46,.05);
    --shadow-md: 0 16px 36px rgba(18,129,115,.14), 0 4px 12px rgba(24,27,46,.08);
    --font-display: "Secular One", "Rubik", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Hebrew", Arial, sans-serif;
    --font-body: "Rubik", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Hebrew", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Courier New", monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 32px,
      var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.55;
    min-height:100vh;
  }
  h1,h2,h3,h4{ text-wrap:balance; }
  ::selection{ background:var(--brand-soft); color:var(--brand-ink); }
  button{ font-family:inherit; }
  input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  button, input[type="checkbox"]{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--brand); outline-offset:2px; border-radius:4px; }
  #app{ width:min(1180px,96vw); margin:0 auto; padding:18px 12px 40px; }

  .visually-hidden{ position:absolute!important; width:1px;height:1px; padding:0;margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .skip-link{
    position:absolute; right:8px; top:-46px; background:var(--ink); color:#fff; padding:10px 16px;
    border-radius:8px; z-index:200; transition:top .15s ease; text-decoration:none; font-size:13px; font-weight:700;
  }
  .skip-link:focus{ top:8px; }

  .masthead{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    padding-bottom:18px; margin-bottom:20px;
  }
  .masthead-title{ display:flex; align-items:center; gap:14px; }
  .masthead h1{ font-family:var(--font-display); font-weight:400; font-size:30px; letter-spacing:.2px; margin:0; color:var(--ink); }
  .masthead .stamp-mark{
    display:inline-flex; align-items:center; justify-content:center;
    width:46px; height:46px; border-radius:32%; color:#fff;
    background:linear-gradient(135deg, var(--brand), var(--coral));
    box-shadow:0 6px 16px rgba(18,129,115,.32);
    font-family:var(--font-display); font-weight:400; font-size:21px; flex:none;
  }
  .masthead p{ margin:3px 0 0; color:var(--ink-soft); font-size:13px; }
  .masthead-actions{ display:flex; gap:8px; flex:none; flex-wrap:wrap; justify-content:flex-end; max-width:440px; }

  .nav-tabs{ display:inline-flex; gap:2px; margin-bottom:20px; background:var(--surface); border:1px solid var(--paper-line); border-radius:999px; padding:4px; box-shadow:var(--shadow-sm); }
  .nav-tab{ position:relative; background:none; border:none; padding:9px 20px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--ink-soft); }
  .nav-tab:hover{ color:var(--ink); }
  .nav-tab.active{ color:#fff; background:var(--brand); box-shadow:0 3px 10px rgba(18,129,115,.35); }

  .card{ background:var(--surface); border:1px solid var(--paper-line); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); }
  .section-label{ font-family:var(--font-mono); text-transform:uppercase; letter-spacing:1.2px; font-size:11px; color:var(--ink-soft); font-weight:600; margin:0 0 10px; }

  .btn{
    display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:999px;
    border:1px solid var(--paper-line); background:var(--surface); font-size:12.5px; font-weight:600; color:var(--ink);
    white-space:nowrap; transition:border-color .12s ease, background .12s ease, transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover{ border-color:var(--ink-faint); transform:translateY(-1px); }
  .btn:active{ transform:translateY(0); }
  .btn-primary{ background:var(--brand); border-color:var(--brand); color:#fff; box-shadow:0 3px 10px rgba(18,129,115,.28); }
  .btn-primary:hover{ background:var(--brand-ink); border-color:var(--brand-ink); box-shadow:0 5px 16px rgba(18,129,115,.36); }
  .btn-ghost{ border-color:transparent; background:none; color:var(--ink-soft); }
  .btn-ghost:hover{ background:var(--paper); transform:none; }
  .btn-danger{ color:var(--bad); }
  .btn-danger:hover{ background:var(--bad-soft); border-color:var(--bad); }
  .btn-sm{ padding:5px 12px; font-size:11.5px; }
  .btn[disabled]{ opacity:.5; cursor:not-allowed; }
  @media (prefers-reduced-motion: reduce){ .btn:hover{ transform:none; } }

  .summary-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px; }
  @media (max-width:800px){ .summary-row{ grid-template-columns:repeat(2,1fr); } }
  .summary-card{ border:1px solid var(--paper-line); border-radius:var(--radius-md); padding:14px 16px; background:var(--surface); box-shadow:var(--shadow-sm); }
  .summary-card .num{ font-family:var(--font-mono); font-size:22px; font-weight:700; direction:ltr; text-align:right; }
  .summary-card .lbl{ font-size:11.5px; color:var(--ink-soft); margin-top:3px; }
  .summary-card.c-income{ background:var(--good-soft); border-color:transparent; }
  .summary-card.c-income .num{ color:var(--good); }
  .summary-card.c-expense{ background:var(--bad-soft); border-color:transparent; }
  .summary-card.c-expense .num{ color:var(--bad); }
  .summary-card.c-net .num.pos{ color:var(--good); }
  .summary-card.c-net .num.neg{ color:var(--bad); }

  .toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:14px 18px; border-bottom:1px solid var(--paper-line); }
  .search-box{ position:relative; flex:1; min-width:180px; max-width:320px; }
  .search-box input{ width:100%; padding:8px 34px 8px 12px; border:1px solid var(--paper-line); border-radius:20px; font-size:12.5px; background:var(--paper); }
  .search-box svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-faint); }
  .spacer{ flex:1; }
  .sort-select{ padding:7px 10px; border:1px solid var(--paper-line); border-radius:var(--radius-sm); background:var(--surface); font-size:12px; }

  .panel{ background:var(--surface); border:1px solid var(--paper-line); border-radius:var(--radius-lg); box-shadow:var(--shadow-md); overflow:hidden; }

  table.data-table{ border-collapse:collapse; width:100%; font-size:12.5px; }
  table.data-table th, table.data-table td{ padding:10px 14px; text-align:right; border-bottom:1px solid var(--paper-line); }
  table.data-table thead th{
    font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft);
    border-bottom:2px solid var(--brand); font-weight:600;
  }
  table.data-table tbody tr{ cursor:pointer; }
  table.data-table tbody tr:hover{ background:var(--paper); }
  table.data-table td.numeric{ font-family:var(--font-mono); direction:ltr; text-align:left; font-variant-numeric:tabular-nums; }
  table.data-table td.numeric.pos{ color:var(--good); }
  table.data-table td.numeric.neg{ color:var(--bad); }
  .table-scroll-x{ overflow-x:auto; }
  .type-pill{ display:inline-flex; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:700; background:var(--brand-soft); color:var(--brand-ink); }
  .type-pill.t-customer{ background:var(--good-soft); color:var(--good); }
  .type-pill.t-supplier{ background:var(--bad-soft); color:var(--bad); }
  .type-pill.t-both{ background:var(--warn-soft); color:var(--warn-ink); }

  .empty-state{ padding:60px 30px; text-align:center; color:var(--ink-soft); }
  .empty-state .es-icon{ margin-bottom:14px; color:var(--ink-faint); font-size:34px; }
  .empty-state h3{ font-family:var(--font-display); font-size:17px; margin:0 0 6px; color:var(--ink); }
  .empty-state p{ font-size:13px; margin:0; }

  .form-panel{ padding:16px 18px; border-bottom:1px solid var(--paper-line); background:var(--paper); }
  .form-panel h4{ margin:0 0 12px; font-size:12.5px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); }
  .form-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; align-items:end; }
  @media (max-width:800px){ .form-grid{ grid-template-columns:repeat(2,1fr); } }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:11px; color:var(--ink-soft); font-weight:600; }
  .field input, .field select, .field textarea{
    padding:8px 10px; border:1px solid var(--paper-line); border-radius:var(--radius-sm); background:var(--surface); font-size:12.5px;
  }
  .field.not-detected input, .field.not-detected select{ border-color:var(--warn); background:var(--warn-soft); }
  .field-hint-warn{ font-size:11px; color:var(--warn-ink); font-weight:700; }
  .form-actions{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:center; }
  .type-toggle{ display:flex; border:1px solid var(--paper-line); border-radius:var(--radius-sm); overflow:hidden; }
  .type-toggle button{ flex:1; padding:8px 10px; border:none; background:var(--surface); font-size:12.5px; font-weight:700; }
  .type-toggle button.active.tt-income{ background:var(--good); color:#fff; }
  .type-toggle button.active.tt-expense{ background:var(--bad); color:#fff; }

  .detail-head{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; padding:16px 18px; border-bottom:1px solid var(--paper-line); }
  .detail-title{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .detail-title h2{ font-family:var(--font-display); font-size:19px; margin:0; }
  .balance-badge{ font-family:var(--font-mono); font-weight:700; font-size:18px; padding:6px 16px; border-radius:20px; direction:ltr; }
  .balance-badge.pos{ background:var(--good-soft); color:var(--good); }
  .balance-badge.neg{ background:var(--bad-soft); color:var(--bad); }
  .balance-badge.zero{ background:var(--paper); color:var(--ink-soft); }

  .receipt-pill{ display:inline-flex; align-items:center; gap:5px; background:var(--brand-soft); color:var(--brand-ink); padding:3px 6px 3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
  .receipt-pill button{ background:none; border:none; color:var(--brand-ink); opacity:.75; font-size:13px; padding:0 2px; }
  .attach-drop{
    position:relative; display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:16px; border:1.4px dashed var(--paper-line);
    color:var(--ink-faint); font-size:11px; font-weight:600; cursor:pointer;
  }
  .attach-drop:hover, .attach-drop.drag-over{ border-color:var(--brand); color:var(--brand-ink); background:var(--brand-soft); }
  .sr-file-input{ position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; margin:0; }

  .upload-zone{
    position:relative; display:block; border:2px dashed var(--paper-line); border-radius:var(--radius-lg);
    padding:44px 20px; text-align:center; color:var(--ink-soft); margin:18px; cursor:pointer;
  }
  .upload-zone.drag-over{ border-color:var(--brand); background:var(--brand-soft); }
  .upload-zone .uz-icon{ font-size:36px; margin-bottom:10px; }
  .upload-zone .dz-empty-title{ font-weight:700; color:var(--ink); }
  .upload-zone .dz-empty-sub{ font-size:12px; margin-top:4px; }

  .banner-warn{ background:var(--warn-soft); color:var(--warn-ink); border:1px solid var(--warn); border-radius:var(--radius-md); padding:14px 16px; margin:14px 18px; font-size:12.5px; line-height:1.7; }

  .progress-wrap{ margin:0 0 10px; }
  .progress-track{ height:8px; background:var(--paper-line); border-radius:8px; overflow:hidden; }
  .progress-fill.indet{ height:100%; width:34%; background:var(--brand); border-radius:8px; animation:pinkas-indet 1.1s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){ .progress-fill.indet{ animation:none; width:60%; } }
  @keyframes pinkas-indet{ 0%{ margin-inline-start:0%; } 50%{ margin-inline-start:64%; } 100%{ margin-inline-start:0%; } }
  .progress-text{ font-size:12.5px; color:var(--ink-soft); }

  .review-grid{ display:grid; grid-template-columns:260px 1fr; gap:20px; padding:18px; align-items:start; }
  @media (max-width:760px){ .review-grid{ grid-template-columns:1fr; } }
  .review-preview{ border:1px solid var(--paper-line); border-radius:var(--radius-md); overflow:hidden; background:var(--paper); min-height:120px; display:flex; align-items:center; justify-content:center; }
  .review-preview img{ width:100%; display:block; }
  .raw-text-box{ margin-top:16px; }
  .raw-text-box summary{ cursor:pointer; font-size:12px; font-weight:700; color:var(--brand-ink); }
  .raw-text-box textarea{ width:100%; min-height:110px; margin-top:8px; font-family:var(--font-mono); font-size:11.5px; direction:ltr; text-align:left; padding:8px; border:1px solid var(--paper-line); border-radius:var(--radius-sm); background:var(--surface); resize:vertical; }

  .queue-progress{ padding:10px 18px; border-bottom:1px solid var(--paper-line); font-size:12.5px; color:var(--ink-soft); background:var(--paper); }

  .chart-svg{ width:100%; height:auto; margin-bottom:8px; }
  .chart-axis-label{ font-family:var(--font-mono); font-size:9.5px; fill:var(--ink-soft); }
  .chart-grid{ stroke:var(--paper-line); stroke-width:1; }
  .chart-grid-zero{ stroke:var(--ink-faint); stroke-width:1; stroke-dasharray:3 3; }
  .chart-legend{ display:flex; gap:16px; margin-bottom:8px; font-size:11.5px; color:var(--ink-soft); }
  .legend-item{ display:inline-flex; align-items:center; gap:6px; }
  .legend-swatch{ width:11px; height:11px; border-radius:3px; display:inline-block; }
  .chart-empty{ color:var(--ink-soft); font-size:12.5px; padding:14px 0; }
  .report-section-title{ font-family:var(--font-display); font-size:15px; margin:22px 0 10px; }
  .report-section-title:first-child{ margin-top:0; }

  .footer-note{ text-align:center; color:var(--ink-soft); font-size:11.5px; margin-top:26px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<a href="#mainContent" class="skip-link">דלג לתוכן הראשי</a>
<div id="app">
  <header class="masthead">
    <div class="masthead-title">
      <span class="stamp-mark" aria-hidden="true">₪</span>
      <div>
        <h1>פנקס</h1>
        <p>ספקים ולקוחות · הכנסות, הוצאות וקבלות במקום אחד — הכל בדפדפן שלך, בלי אינטרנט, בחינם</p>
      </div>
    </div>
    <div class="masthead-actions">
      <button class="btn btn-sm" id="licenseBadge" data-action="open-license"></button>
      <button class="btn btn-sm" id="folderBadge" data-action="open-folder"></button>
      <button class="btn btn-sm" data-action="open-scan">📷 סריקת קבלה</button>
      <button class="btn btn-sm" data-action="open-batch">📚 ייבוא קבוצתי</button>
      <button class="btn btn-sm" data-action="export-backup">⭳ גיבוי</button>
      <button class="btn btn-sm" data-action="trigger-import">⭱ שחזור</button>
    </div>
  </header>
  <main id="mainContent">
    <div id="view"></div>
  </main>
  <p class="footer-note">כל הנתונים, כולל תמונות הקבלות, נשמרים מקומית בדפדפן שלך בלבד (IndexedDB) — שום דבר לא נשלח לשרת</p>
</div>
<input type="file" id="importInput" accept="application/json" aria-label="בחירת קובץ גיבוי לשחזור" hidden>

<script>
(function(){
"use strict";

/* ============================= DB ============================= */
const DB_NAME='pinkas-db', DB_VERSION=2;
let dbPromise=null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise=new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('contacts')) db.createObjectStore('contacts',{keyPath:'id'});
      if(!db.objectStoreNames.contains('transactions')){
        const s=db.createObjectStore('transactions',{keyPath:'id'});
        s.createIndex('contactId','contactId');
      }
      if(!db.objectStoreNames.contains('receipts')) db.createObjectStore('receipts',{keyPath:'id'});
      if(!db.objectStoreNames.contains('handles')) db.createObjectStore('handles',{keyPath:'id'});
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
  return dbPromise;
}
async function tx(storeName,mode){ const db=await openDB(); return db.transaction(storeName,mode).objectStore(storeName); }
async function dbGetAll(storeName){ const s=await tx(storeName,'readonly'); return new Promise((res,rej)=>{ const r=s.getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function dbGet(storeName,key){ const s=await tx(storeName,'readonly'); return new Promise((res,rej)=>{ const r=s.get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function dbPut(storeName,obj){ const s=await tx(storeName,'readwrite'); return new Promise((res,rej)=>{ const r=s.put(obj); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }
async function dbDelete(storeName,id){ const s=await tx(storeName,'readwrite'); return new Promise((res,rej)=>{ const r=s.delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }
async function dbClear(storeName){ const s=await tx(storeName,'readwrite'); return new Promise((res,rej)=>{ const r=s.clear(); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }

/* ============================= LICENSE (pro features gate) ============================= */
// Fill this in after deploying license-server/ (see license-server/README.md).
// Left empty, licensing is simply off: pro features stay locked with a note explaining why.
const LICENSE_SERVER_URL='';
const PURCHASE_URL='';
const LICENSE_RECHECK_DAYS=14;
const LICENSE_OFFLINE_MAX_DAYS=45;

function loadLicenseState(){
  try{ const raw=localStorage.getItem('pinkas-license'); return raw?JSON.parse(raw):null; }
  catch{ return null; }
}
function saveLicenseState(lic){
  try{ localStorage.setItem('pinkas-license', JSON.stringify(lic)); }catch{}
}
function clearLicenseState(){
  try{ localStorage.removeItem('pinkas-license'); }catch{}
}
function getOrCreateDeviceId(){
  try{
    let id=localStorage.getItem('pinkas-device-id');
    if(!id){ id=uid(); localStorage.setItem('pinkas-device-id', id); }
    return id;
  }catch{ return uid(); }
}
function isPro(){ return !!(state.license && state.license.valid); }
function updateLicenseBadge(){
  const el=document.getElementById('licenseBadge');
  if(!el) return;
  if(isPro()){ el.textContent='✓ פרו'; el.setAttribute('aria-label','רישיון פרו פעיל — לניהול הרישיון'); }
  else { el.textContent='🔒 חינמי'; el.setAttribute('aria-label','גרסה חינמית — למעבר לרישיון פרו'); }
}
async function verifyLicense(key, activate){
  if(!LICENSE_SERVER_URL) return { valid:false, error:'server_not_configured' };
  try{
    const resp=await fetch(LICENSE_SERVER_URL.replace(/\/$/,'')+'/verify', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ key, activate:!!activate, deviceId:getOrCreateDeviceId() })
    });
    const data=await resp.json();
    return { ...data, key, checkedAt:Date.now() };
  }catch(err){
    return { valid:false, error:'network', networkError:true, key };
  }
}
async function activateLicense(key){
  key=(key||'').trim();
  if(!key) return { valid:false, error:'missing_key' };
  const result=await verifyLicense(key, true);
  state.license=result;
  saveLicenseState(result);
  render();
  return result;
}
function deactivateLicense(){
  state.license={ valid:false };
  clearLicenseState();
  render();
}
async function backgroundRecheckLicense(){
  const lic=state.license;
  if(!lic || !lic.key) return;
  const daysSince=(Date.now()-(lic.checkedAt||0))/86400000;
  if(daysSince<LICENSE_RECHECK_DAYS) return;
  const result=await verifyLicense(lic.key, false);
  if(result.networkError){
    if(daysSince>LICENSE_OFFLINE_MAX_DAYS){
      state.license={ ...lic, valid:false, error:'offline_grace_expired' };
      saveLicenseState(state.license);
      render();
    }
    return;
  }
  state.license=result;
  saveLicenseState(result);
  render();
}
function licenseErrorMessage(err){
  const map={
    server_not_configured:'שרת הרישוי עדיין לא הוגדר באפליקציה זו.',
    missing_key:'נא להזין מפתח רישיון.',
    network:'לא ניתן להתחבר לשרת האימות כרגע. אם כבר הפעלתם בעבר, האפליקציה תמשיך לעבוד; אחרת נסו שוב כשיש אינטרנט.',
    verification_unreachable:'שרת האימות אינו זמין כרגע. נסו שוב בעוד כמה דקות.',
    invalid_license:'מפתח הרישיון אינו תקין.',
    refunded_or_chargebacked:'הרכישה המשויכת למפתח זה בוטלה או הוחזרה.',
    max_activations_reached:'המפתח הזה כבר הופעל במספר המרבי של מכשירים.',
    offline_grace_expired:'לא הצלחנו לאמת את הרישיון מול השרת יותר מדי זמן. נא להתחבר לאינטרנט פעם אחת לאימות מחדש.'
  };
  return map[err] || err || 'שגיאה לא ידועה באימות הרישיון.';
}

/* ============================= WORKING FOLDER (local files, optionally Drive/Dropbox-synced) ============================= */
// Mirrors contacts+transactions (JSON) and receipts (real files) into a folder the user
// picks on their own computer. Nothing here talks to any server - if that folder happens
// to live inside a Google Drive / Dropbox / OneDrive desktop-sync folder, cloud backup and
// multi-device access come for free, with the data staying only in the user's own account.
let folderHandle=null;
let folderSyncTimer=null;

function supportsFileSystemAccess(){ return typeof window!=='undefined' && 'showDirectoryPicker' in window; }
function sanitizeFileName(name){ return String(name||'').replace(/[\/\\:*?"<>|]/g,'_').slice(0,180); }

async function chooseWorkFolder(){
  if(!supportsFileSystemAccess()){ alert('התכונה הזו זמינה כרגע רק ב-Chrome או Edge.'); return; }
  let handle;
  try{ handle=await window.showDirectoryPicker({ mode:'readwrite' }); }
  catch(err){ if(err && err.name!=='AbortError') alert('שגיאה בבחירת תיקייה: '+err.message); return; }

  const existing=await tryReadFolderData(handle);
  try{ await dbPut('handles', { id:'workFolder', handle, folderName:handle.name }); }
  catch(err){ console.warn('could not persist folder handle for next session', err); }
  folderHandle=handle;
  state.folderSync={ connected:true, folderName:handle.name, needsReconnect:false, lastSyncAt:null, status:'idle', error:null };

  if(existing && state.contacts.length===0 && state.transactions.length===0 && (existing.contacts.length||existing.transactions?.length)){
    if(confirm(`נמצאו נתונים קיימים בתיקייה "${handle.name}" (${existing.contacts.length} ספקים/לקוחות). לייבא אותם עכשיו?`)){
      await importFromFolderData(existing);
    }
  }
  render();
  await syncToFolder();
}
async function reconnectWorkFolderOnLoad(){
  let rec;
  try{ rec=await dbGet('handles','workFolder'); }catch{ return; }
  if(!rec || !rec.handle) return;
  let perm;
  try{ perm=await rec.handle.queryPermission({ mode:'readwrite' }); }catch{ perm='denied'; }
  if(perm==='granted'){
    folderHandle=rec.handle;
    state.folderSync={ connected:true, folderName:rec.folderName, needsReconnect:false, lastSyncAt:null, status:'idle', error:null };
  } else {
    state.folderSync={ connected:false, folderName:rec.folderName, needsReconnect:true, lastSyncAt:null, status:'idle', error:null };
  }
  updateFolderBadge();
}
async function reconnectWorkFolderPermission(){
  let rec;
  try{ rec=await dbGet('handles','workFolder'); }catch{ return; }
  if(!rec || !rec.handle) return;
  let perm;
  try{ perm=await rec.handle.requestPermission({ mode:'readwrite' }); }
  catch(err){ alert('שגיאה באישור הגישה: '+err.message); return; }
  if(perm==='granted'){
    folderHandle=rec.handle;
    state.folderSync={ connected:true, folderName:rec.folderName, needsReconnect:false, lastSyncAt:null, status:'idle', error:null };
    render();
    await syncToFolder();
  } else {
    alert('הגישה לתיקייה לא אושרה.');
  }
}
async function disconnectWorkFolder(){
  if(!confirm('להפסיק לסנכרן לתיקייה? הקבצים שכבר נכתבו אליה יישארו שם, אבל שינויים עתידיים לא ישמרו אליה עוד.')) return;
  await dbDelete('handles','workFolder');
  folderHandle=null;
  state.folderSync={ connected:false, folderName:null, needsReconnect:false, lastSyncAt:null, status:'idle', error:null };
  render();
}
function scheduleFolderSync(){
  if(!folderHandle) return;
  clearTimeout(folderSyncTimer);
  folderSyncTimer=setTimeout(()=>{ syncToFolder(); }, 800);
}
async function syncToFolder(){
  if(!folderHandle) return;
  state.folderSync.status='syncing'; updateFolderBadge();
  try{
    const payload={ app:'pinkas', version:2, exportedAt:new Date().toISOString(), contacts:state.contacts, transactions:state.transactions };
    const fileHandle=await folderHandle.getFileHandle('pinkas-data.json', { create:true });
    const writable=await fileHandle.createWritable();
    await writable.write(JSON.stringify(payload,null,2));
    await writable.close();

    const receiptsDir=await folderHandle.getDirectoryHandle('receipts', { create:true });
    const receipts=await dbGetAll('receipts');
    for(const r of receipts){
      const rh=await receiptsDir.getFileHandle(sanitizeFileName(`${r.id}-${r.fileName}`), { create:true });
      const w=await rh.createWritable();
      await w.write(r.blob);
      await w.close();
    }
    state.folderSync.status='idle'; state.folderSync.lastSyncAt=Date.now(); state.folderSync.error=null;
  }catch(err){
    state.folderSync.status='error'; state.folderSync.error=err.message;
  }
  updateFolderBadge();
}
async function tryReadFolderData(handle){
  try{
    const fh=await handle.getFileHandle('pinkas-data.json');
    const file=await fh.getFile();
    const data=JSON.parse(await file.text());
    if(data && data.app==='pinkas' && Array.isArray(data.contacts)) return data;
  }catch{ /* no existing data in this folder yet - that's fine */ }
  return null;
}
async function importFromFolderData(data){
  await dbClear('contacts'); await dbClear('transactions'); await dbClear('receipts');
  for(const c of data.contacts) await dbPut('contacts', c);
  for(const t of data.transactions||[]) await dbPut('transactions', t);
  try{
    const receiptsDir=await folderHandle.getDirectoryHandle('receipts');
    for(const t of data.transactions||[]){
      if(!t.receiptId) continue;
      const prefix=t.receiptId+'-';
      for await (const [name, fh] of receiptsDir.entries()){
        if(fh.kind==='file' && name.startsWith(prefix)){
          const file=await fh.getFile();
          await dbPut('receipts', { id:t.receiptId, transactionId:t.id, fileName:name.slice(prefix.length), mimeType:file.type||'application/octet-stream', extractedText:'', blob:file, createdAt:Date.now() });
        }
      }
    }
  }catch{ /* no receipts subfolder - fine */ }
  await loadAll();
}
function updateFolderBadge(){
  const el=document.getElementById('folderBadge');
  if(!el) return;
  const fs=state.folderSync;
  if(!fs || !fs.folderName){ el.textContent='☁ תיקיית עבודה'; el.setAttribute('aria-label','חיבור תיקיית עבודה מקומית (אופציונלי)'); }
  else if(fs.connected && fs.status==='syncing'){ el.textContent='☁ שומר…'; el.setAttribute('aria-label','שומר לתיקיית העבודה'); }
  else if(fs.connected && fs.status==='error'){ el.textContent='☁ שגיאה'; el.setAttribute('aria-label','שגיאה בשמירה לתיקיית העבודה'); }
  else if(fs.connected){ el.textContent='☁ מסונכרן'; el.setAttribute('aria-label','מסונכרן לתיקיית עבודה: '+fs.folderName); }
  else { el.textContent='☁ נדרש חיבור מחדש'; el.setAttribute('aria-label','תיקיית העבודה דורשת אישור גישה מחדש'); }
}

/* ============================= STATE ============================= */
const state={
  view:'dashboard',      // dashboard | contact | reports | scan | batch | license
  contactId:null,
  contacts:[],
  transactions:[],
  receiptsMeta:{},        // id -> {fileName,mimeType}
  search:'',
  sortBy:'name',
  showAddContact:false,
  showAddTx:false,
  txType:'income',
  pendingReceiptFile:null,
  reportsContactId:'all',
  editContactId:null,
  exportMonth:null,
  scan:null,
  batch:null,
  license: loadLicenseState() || { valid:false },
  folderSync: { connected:false, folderName:null, needsReconnect:false, lastSyncAt:null, status:'idle', error:null }
};

function uid(){ return (crypto.randomUUID? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMoney(n){ return new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',maximumFractionDigits:2}).format(n||0); }
function fmtDate(d){ if(!d) return ''; const dt=new Date(d); if(isNaN(dt)) return esc(d); return dt.toLocaleDateString('he-IL'); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function round2(n){ return Math.round(n*100)/100; }

function typeLabel(t){ return t==='supplier'?'ספק':t==='customer'?'לקוח':'ספק ולקוח'; }
function typeClass(t){ return t==='supplier'?'t-supplier':t==='customer'?'t-customer':'t-both'; }

/* ============================= מספר הקצאה (invoice allocation number) ============================= */
function allocationThreshold(dateStr){
  if(!dateStr) return 20000;
  if(dateStr>='2026-06-01') return 5000;
  if(dateStr>='2026-01-01') return 10000;
  return 20000;
}
function needsAllocation(t){ return t && t.amount>=allocationThreshold(t.date); }

/* ============================= DERIVED DATA ============================= */
function txForContact(contactId){ return state.transactions.filter(t=>t.contactId===contactId); }
function contactBalance(contactId){
  const rows=txForContact(contactId);
  const income=rows.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense=rows.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  return {income,expense,net:income-expense};
}
function totals(){
  const income=state.transactions.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense=state.transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  return {income,expense,net:income-expense,contacts:state.contacts.length};
}
function findMatchingContact(name){
  if(!name) return null;
  const n=name.trim().toLowerCase();
  if(n.length<2) return null;
  return state.contacts.find(c=>c.name.toLowerCase()===n)
      || state.contacts.find(c=>c.name.toLowerCase().includes(n) || n.includes(c.name.toLowerCase()))
      || null;
}

/* ============================= LOAD ============================= */
async function loadAll(){
  const [contacts,transactions,receipts]=await Promise.all([dbGetAll('contacts'),dbGetAll('transactions'),dbGetAll('receipts')]);
  state.contacts=contacts;
  state.transactions=transactions;
  state.receiptsMeta={};
  receipts.forEach(r=>{ state.receiptsMeta[r.id]={fileName:r.fileName,mimeType:r.mimeType}; });
  render();
}

/* ============================= RENDER SHELL ============================= */
function render(){
  const el=document.getElementById('view');
  let html;
  try{
    if(state.view==='contact') html=renderContactView();
    else if(state.view==='reports') html=renderReports();
    else if(state.view==='scan') html=renderScanView();
    else if(state.view==='batch') html=renderBatchView();
    else if(state.view==='license') html=renderLicenseView();
    else if(state.view==='folder') html=renderFolderView();
    else html=renderDashboard();
  }catch(err){
    console.error('render error', err);
    el.innerHTML = renderNavTabs()+`<div class="panel"><div class="empty-state"><div class="es-icon" aria-hidden="true">⚠</div><h3>אירעה שגיאה בהצגת המסך</h3><p>${esc(err&&err.message||'')}</p><p><button class="btn btn-primary btn-sm" data-action="nav-dashboard">חזרה ללוח הבקרה</button></p></div></div>`;
    return;
  }
  el.innerHTML = renderNavTabs()+html;
  updateLicenseBadge();
  updateFolderBadge();
}
function renderNavTabs(){
  const dashActive = state.view==='dashboard' || state.view==='contact' || state.view==='scan' || state.view==='batch';
  return `<nav class="nav-tabs" aria-label="ניווט ראשי">
    <button class="nav-tab ${dashActive?'active':''}" data-action="nav-dashboard" ${dashActive?'aria-current="page"':''}>לוח בקרה</button>
    <button class="nav-tab ${state.view==='reports'?'active':''}" data-action="nav-reports" ${state.view==='reports'?'aria-current="page"':''}>דוחות ומאזנים</button>
  </nav>`;
}
function focusRegion(){
  requestAnimationFrame(()=>{
    const heading=document.querySelector('#view h2');
    if(heading){ heading.setAttribute('tabindex','-1'); heading.focus({preventScroll:false}); }
  });
}

/* ============================= OCR / EXTRACTION ENGINE ============================= */
const FILE_PROTOCOL_NOTE = 'הקובץ נפתח ישירות מהדיסק (לא דרך אתר/שרת), ולכן זיהוי אוטומטי של קבלות אינו זמין בדפדפן מטעמי אבטחה (הדפדפן חוסם הרצת מנוע OCR מקובץ מקומי). ניתן עדיין לצרף את הקבלה ולמלא את הפרטים ידנית — או להפעיל את פנקס דרך שרת מקומי / אחסון כמו GitHub Pages כדי להפעיל את הזיהוי האוטומטי.';

let vendorLoadPromise=null;
function loadScriptOnce(src){
  return new Promise((resolve,reject)=>{
    if(document.querySelector(`script[data-vendor-src="${src}"]`)){ resolve(); return; }
    const s=document.createElement('script');
    s.src=src; s.dataset.vendorSrc=src;
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error('טעינת ספריית עזר נכשלה ('+src+')'));
    document.head.appendChild(s);
  });
}
async function ensureOcrEngines(){
  if(vendorLoadPromise) return vendorLoadPromise;
  vendorLoadPromise=(async()=>{
    if(!window.pdfjsLib) await loadScriptOnce('vendor/pdfjs/pdf.min.js');
    if(window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdfjs/pdf.worker.min.js';
    if(!window.Tesseract) await loadScriptOnce('vendor/tesseract/tesseract.min.js');
  })();
  return vendorLoadPromise;
}

let tesseractWorkerPromise=null;
let activeProgressHandler=null;
async function getTesseractWorker(){
  await ensureOcrEngines();
  if(!tesseractWorkerPromise){
    tesseractWorkerPromise=window.Tesseract.createWorker(['heb','eng'],1,{
      workerPath:'vendor/tesseract/worker.min.js',
      corePath:'vendor/tesseract/tesseract-core-simd-lstm.wasm.js',
      langPath:'vendor/tesseract/lang',
      gzip:true,
      logger:(m)=>{ if(activeProgressHandler) activeProgressHandler(m); }
    });
  }
  return tesseractWorkerPromise;
}
async function ocrImage(source, onPercent){
  const worker=await getTesseractWorker();
  activeProgressHandler=(m)=>{ if(onPercent && m && m.status==='recognizing text') onPercent(Math.round((m.progress||0)*100)); };
  try{
    const { data } = await worker.recognize(source);
    return (data && data.text) || '';
  } finally {
    activeProgressHandler=null;
  }
}
function buildTextWithLineBreaks(items){
  let text=''; let lastY=null;
  for(const it of items){
    const y = it.transform ? it.transform[5] : null;
    if(text && lastY!=null && y!=null && Math.abs(y-lastY)>2) text+='\n';
    else if(text && !text.endsWith('\n')) text+=' ';
    text+=it.str;
    if(y!=null) lastY=y;
  }
  return text.replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').trim();
}
async function extractPdfPages(file, onProgress){
  await ensureOcrEngines();
  const buf=await file.arrayBuffer();
  const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  const pages=[];
  const baseName=file.name.replace(/\.pdf$/i,'');
  for(let i=1;i<=pdf.numPages;i++){
    if(onProgress) onProgress(i,pdf.numPages,null);
    const page=await pdf.getPage(i);
    const textContent=await page.getTextContent();
    let text=buildTextWithLineBreaks(textContent.items);
    let engine='pdf-text';
    const viewport=page.getViewport({scale:2});
    const canvas=document.createElement('canvas');
    canvas.width=Math.ceil(viewport.width); canvas.height=Math.ceil(viewport.height);
    await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
    if(text.length<8){
      text=await ocrImage(canvas, pct=>onProgress&&onProgress(i,pdf.numPages,pct));
      engine='ocr';
    }
    const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
    pages.push({ text, engine, blob, fileName:`${baseName}-עמוד-${i}.png` });
  }
  return pages;
}

function parseReceiptFields(text){
  const norm=(text||'').replace(/[‎‏]/g,'');
  const lines=norm.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const out=emptyParsed();

  const amountKeywordRe=/(סה"?כ|סך הכל|לתשלום|total due|grand total|amount due|total)/i;
  const numRe=/\d{1,3}(?:[,\s]\d{3})+(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?/g;
  let keywordBest=null;
  for(const line of lines){
    if(amountKeywordRe.test(line)){
      const nums=(line.match(numRe)||[]).map(s=>parseFloat(s.replace(/[,\s]/g,''))).filter(n=>n>0 && n<10000000);
      if(nums.length) keywordBest = keywordBest==null ? Math.max(...nums) : Math.max(keywordBest, Math.max(...nums));
    }
  }
  if(keywordBest!=null){ out.amount={value:round2(keywordBest), confidence:'high'}; }
  else{
    const allNums=(norm.match(numRe)||[]).map(s=>parseFloat(s.replace(/[,\s]/g,''))).filter(n=>n>0 && n<10000000);
    if(allNums.length){ out.amount={value:round2(Math.max(...allNums)), confidence:'low'}; }
  }

  const iso=parseDateFromText(norm);
  if(iso) out.date={value:iso, confidence:'high'};

  const skipLineRe=/^[\d\s.,:%\/\-]+$/;
  const vendorLine=lines.find(l=>l.length>=2 && l.length<=45 && !skipLineRe.test(l) && !amountKeywordRe.test(l));
  if(vendorLine) out.vendor={value:vendorLine, confidence:'medium'};

  return out;
}
function parseDateFromText(norm){
  let m=norm.match(/\b(\d{4})[.\/\-](\d{1,2})[.\/\-](\d{1,2})\b/);
  if(m) return isoOrNull(m[1],m[2],m[3]);
  m=norm.match(/\b(\d{1,2})[.\/\-](\d{1,2})[.\/\-](\d{2,4})\b/);
  if(m){ let y=m[3]; if(y.length===2) y=(parseInt(y,10)>50?'19':'20')+y; return isoOrNull(y,m[2],m[1]); }
  return null;
}
function isoOrNull(y,mo,d){
  y=parseInt(y,10); mo=parseInt(mo,10); d=parseInt(d,10);
  if(!(mo>=1&&mo<=12&&d>=1&&d<=31)) return null;
  const nowY=new Date().getFullYear();
  if(y<1990||y>nowY+1) return null;
  return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

async function handleScanFile(file){
  state.scan={ status:'extracting', file, previewSrc:null, progressText:'מתחיל…', note:null, rawText:'', parsed:emptyParsed(), receiptBlob:null, receiptFileName:file.name, form:null };
  state.view='scan';
  render(); focusRegion();
  if(location.protocol==='file:'){
    applyScanExtraction({ text:'', engine:null, blob:file, fileName:file.name, note:FILE_PROTOCOL_NOTE });
    return;
  }
  try{
    if(file.type==='application/pdf'){
      const pages=await extractPdfPages(file, (cur,total,pct)=>{
        if(!state.scan) return;
        state.scan.progressText = pct!=null ? `קורא עמוד ${cur} מתוך ${total}… ${pct}%` : `מעבד עמוד ${cur} מתוך ${total}…`;
        render();
      });
      if(!state.scan) return;
      if(pages.length>1){ startBatchFromPages(pages, `קובץ ה-PDF שהעליתם מכיל ${pages.length} עמודים — כל עמוד מוצג כקבלה נפרדת לאישור.`); return; }
      applyScanExtraction({ ...pages[0], note:null });
    } else if(file.type.startsWith('image/')){
      const text=await ocrImage(file, pct=>{ if(!state.scan) return; state.scan.progressText=`קורא את הקבלה… ${pct}%`; render(); });
      if(!state.scan) return;
      applyScanExtraction({ text, engine:'ocr', blob:file, fileName:file.name, note:null });
    } else {
      applyScanExtraction({ text:'', engine:null, blob:file, fileName:file.name, note:'סוג קובץ לא נתמך לזיהוי אוטומטי (נתמכים: תמונה או PDF). ניתן להזין את הפרטים ידנית והקובץ עדיין יצורף כקבלה.' });
    }
  }catch(err){
    if(!state.scan) return;
    applyScanExtraction({ text:'', engine:null, blob:file, fileName:file.name, note:'שגיאה בזיהוי האוטומטי ('+((err&&err.message)||'לא ידועה')+'). ניתן להזין את הפרטים ידנית והקובץ עדיין יצורף כקבלה.' });
  }
}
function applyScanExtraction({text,engine,blob,fileName,note}){
  const parsed = text ? parseReceiptFields(text) : emptyParsed();
  const previewSrc = blob && blob.type && blob.type.startsWith('image/') ? URL.createObjectURL(blob) : null;
  const matched = findMatchingContact(parsed.vendor.value);
  state.scan={
    status:'review', file:state.scan?state.scan.file:null, previewSrc, rawText:text||'', engine, note,
    parsed, receiptBlob:blob, receiptFileName:fileName,
    form:{
      contactSel: matched?matched.id:'__new__',
      newContactName: parsed.vendor.value||'',
      newContactType:'supplier',
      newBusinessId:'',
      type:'expense',
      amount: parsed.amount.value!=null?String(parsed.amount.value):'',
      date: parsed.date.value||todayISO(),
      description: parsed.vendor.value||'',
      allocationNumber:''
    }
  };
  render(); focusRegion();
}
async function confirmScan(){
  const s=state.scan; if(!s||s.status!=='review') return;
  const f=s.form;
  const amount=parseFloat(f.amount);
  if(!amount||amount<=0||!f.date){ alert('נא למלא סכום ותאריך תקינים.'); return; }
  let contactId=f.contactSel;
  if(contactId==='__new__'){
    const name=f.newContactName.trim();
    if(!name){ alert('נא להזין שם ספק/לקוח.'); return; }
    const c={ id:uid(), name, type:f.newContactType||'supplier', phone:'', businessId:(f.newBusinessId||'').trim(), notes:'', createdAt:Date.now() };
    await dbPut('contacts',c); state.contacts.push(c); contactId=c.id;
  }
  const t={ id:uid(), contactId, type:f.type, amount, date:f.date, description:f.description.trim(), allocationNumber:(f.allocationNumber||'').trim(), receiptId:null, createdAt:Date.now() };
  t.receiptId=await storeReceiptBlob(s.receiptBlob, s.receiptFileName||'קבלה', t.id, s.rawText);
  await dbPut('transactions',t); state.transactions.push(t);
  if(s.previewSrc) URL.revokeObjectURL(s.previewSrc);
  state.scan=null; state.view='contact'; state.contactId=contactId;
  scheduleFolderSync();
  render(); focusRegion();
}
function cancelScan(){
  if(state.scan && state.scan.previewSrc) URL.revokeObjectURL(state.scan.previewSrc);
  state.scan=null; state.view='dashboard'; render();
}

async function handleBatchFile(file){
  state.batch={ status:'extracting', mode:file.type==='application/pdf'?'pdf':(file.type.startsWith('image/')?'image':'other'), file, progressText:'מתחיל…', queue:[], index:0, approvedCount:0, skippedCount:0, splitCount:2, splitOrientation:'row', note:null };
  render(); focusRegion();
  if(location.protocol==='file:'){
    state.batch.status='idle'; state.batch.note=FILE_PROTOCOL_NOTE; render(); return;
  }
  try{
    if(state.batch.mode==='pdf'){
      const pages=await extractPdfPages(file, (cur,total,pct)=>{
        if(!state.batch) return;
        state.batch.progressText = pct!=null ? `קורא עמוד ${cur} מתוך ${total}… ${pct}%` : `מעבד עמוד ${cur} מתוך ${total}…`;
        render();
      });
      buildBatchQueue(pages);
    } else if(state.batch.mode==='image'){
      state.batch.status='split-setup'; render(); focusRegion();
    } else {
      state.batch.status='idle'; state.batch.note='סוג קובץ לא נתמך. נא לבחור תמונה או PDF.'; render();
    }
  }catch(err){
    if(!state.batch) return;
    state.batch.status='idle'; state.batch.note='שגיאה בעיבוד הקובץ: '+((err&&err.message)||'לא ידועה'); render();
  }
}
async function performImageSplit(){
  const b=state.batch; const file=b.file;
  const n=Math.max(1,Math.min(20,b.splitCount||1));
  try{
    const bitmap=await createImageBitmap(file);
    const pieces=[];
    for(let i=0;i<n;i++){
      let sx,sy,sw,sh;
      if(b.splitOrientation==='row'){ sw=Math.floor(bitmap.width/n); sh=bitmap.height; sx=i*sw; sy=0; if(i===n-1) sw=bitmap.width-sx; }
      else { sh=Math.floor(bitmap.height/n); sw=bitmap.width; sy=i*sh; sx=0; if(i===n-1) sh=bitmap.height-sy; }
      const canvas=document.createElement('canvas');
      canvas.width=Math.max(1,sw); canvas.height=Math.max(1,sh);
      canvas.getContext('2d').drawImage(bitmap, sx,sy,sw,sh, 0,0, sw,sh);
      const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
      pieces.push({ blob, fileName:`${file.name.replace(/\.[^.]+$/,'')}-חלק-${i+1}.png` });
    }
    state.batch.status='extracting'; state.batch.progressText='מתחיל…'; render();
    const results=[];
    for(let i=0;i<pieces.length;i++){
      state.batch.progressText=`קורא קטע ${i+1} מתוך ${pieces.length}…`; render();
      const text=await ocrImage(pieces[i].blob, pct=>{ if(!state.batch) return; state.batch.progressText=`קורא קטע ${i+1} מתוך ${pieces.length}… ${pct}%`; render(); });
      results.push({ text, engine:'ocr', blob:pieces[i].blob, fileName:pieces[i].fileName });
    }
    buildBatchQueue(results);
  }catch(err){
    if(!state.batch) return;
    state.batch.status='idle'; state.batch.note='שגיאה בפיצול התמונה: '+((err&&err.message)||'לא ידועה'); render();
  }
}
function buildBatchQueue(items){
  const b=state.batch;
  b.queue=items.map(it=>{
    const parsed=it.text?parseReceiptFields(it.text):emptyParsed();
    const matched=findMatchingContact(parsed.vendor.value);
    return {
      blob:it.blob, fileName:it.fileName, rawText:it.text||'', engine:it.engine,
      previewSrc: it.blob?URL.createObjectURL(it.blob):null,
      parsed, decision:'pending',
      form:{
        contactSel: matched?matched.id:'__new__',
        newContactName: parsed.vendor.value||'',
        newContactType:'supplier', newBusinessId:'', type:'expense',
        amount: parsed.amount.value!=null?String(parsed.amount.value):'',
        date: parsed.date.value||todayISO(),
        description: parsed.vendor.value||'',
        allocationNumber:''
      }
    };
  });
  b.index=0;
  if(b.queue.length){ b.status='review'; } else { b.status='idle'; b.note=b.note||'לא נמצאו קבלות בקובץ.'; }
  render(); focusRegion();
}
async function approveBatchItem(){
  const b=state.batch; const item=b.queue[b.index]; const f=item.form;
  const amount=parseFloat(f.amount);
  if(!amount||amount<=0||!f.date){ alert('נא למלא סכום ותאריך תקינים.'); return; }
  let contactId=f.contactSel;
  if(contactId==='__new__'){
    const name=f.newContactName.trim();
    if(!name){ alert('נא להזין שם ספק/לקוח.'); return; }
    const c={ id:uid(), name, type:f.newContactType||'supplier', phone:'', businessId:(f.newBusinessId||'').trim(), notes:'', createdAt:Date.now() };
    await dbPut('contacts',c); state.contacts.push(c); contactId=c.id;
  }
  const t={ id:uid(), contactId, type:f.type, amount, date:f.date, description:f.description.trim(), allocationNumber:(f.allocationNumber||'').trim(), receiptId:null, createdAt:Date.now() };
  t.receiptId=await storeReceiptBlob(item.blob, item.fileName, t.id, item.rawText);
  await dbPut('transactions',t); state.transactions.push(t);
  item.decision='approved'; b.approvedCount++;
  scheduleFolderSync();
  advanceBatch();
}
async function skipBatchItem(){
  const b=state.batch; b.queue[b.index].decision='skipped'; b.skippedCount++;
  advanceBatch();
}
function advanceBatch(){
  const b=state.batch; b.note=null; b.index++;
  if(b.index>=b.queue.length){ b.status='done'; }
  render(); focusRegion();
}
function cancelBatch(){
  if(state.batch) state.batch.queue.forEach(q=>{ if(q.previewSrc) URL.revokeObjectURL(q.previewSrc); });
  state.batch=null; state.view='dashboard'; render();
}
function startBatchFromPages(pages, note){
  if(state.scan && state.scan.previewSrc) URL.revokeObjectURL(state.scan.previewSrc);
  state.scan=null;
  state.view='batch';
  state.batch={ status:'extracting', mode:'pdf', file:null, progressText:'', queue:[], index:0, approvedCount:0, skippedCount:0, splitCount:2, splitOrientation:'row', note };
  buildBatchQueue(pages);
}

async function addContact(form){
  const fd=new FormData(form);
  const name=(fd.get('name')||'').toString().trim();
  if(!name) return;

function downloadBlob(name,blob){
  const u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}
function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result.split(',')[1]);
    r.onerror=reject;
    r.readAsDataURL(blob);
  });
}
function base64ToBlob(b64,mime){
  const bin=atob(b64); const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
async function exportBackup(){

  const payload={ app:'pinkas', version:2, exportedAt:new Date().toISOString(), contacts:state.contacts, transactions:state.transactions, receipts:receiptsOut };
  downloadBlob(`פנקס-גיבוי-${todayISO()}.json`, new Blob([JSON.stringify(payload)],{type:'application/json'}));

const HE_MONTHS=['ינו׳','פבר׳','מרץ','אפר׳','מאי','יוני','יולי','אוג׳','ספט׳','אוק׳','נוב׳','דצמ׳'];
function periodLabelMonth(k){ const [y,m]=k.split('-'); return `${HE_MONTHS[parseInt(m,10)-1]} ${y}`; }
function aggregateByPeriod(transactions, keyFn){
  const map=new Map();
  for(const t of transactions){
    const k=keyFn(t);
    if(!map.has(k)) map.set(k,{income:0,expense:0});
    const e=map.get(k);
    if(t.type==='income') e.income+=t.amount; else e.expense+=t.amount;
  }
  return [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([period,v])=>({period, income:v.income, expense:v.expense, net:v.income-v.expense}));
}
function fmtCompact(n){ const a=Math.abs(n); if(a>=1000) return (n/1000).toFixed(a>=10000?0:1).replace(/\.0$/,'')+'K'; return String(Math.round(n)); }

function csvEscape(v){
  const s=String(v==null?'':v);
  return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function isoToDDMMYYYY(iso){ const p=(iso||'').split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : (iso||''); }
function exportTransactionsCsv(txs, filenameBase){
  const rows=txs.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const header=['תאריך','שם ספק/לקוח','מס\' עוסק/ח.פ','סוג ספק/לקוח','סוג תנועה','תיאור','סכום','מס\' הקצאה','חסר מס\' הקצאה נדרש','יש קבלה מצורפת'];
  const lines=[header];
  let income=0, expense=0;
  for(const t of rows){
    const c=state.contacts.find(x=>x.id===t.contactId);
    if(t.type==='income') income+=t.amount; else expense+=t.amount;
    lines.push([
      isoToDDMMYYYY(t.date), c?c.name:'—', c?(c.businessId||''):'', c?typeLabel(c.type):'',
      t.type==='income'?'הכנסה':'הוצאה', t.description||'', t.amount.toFixed(2),
      t.allocationNumber||'', (needsAllocation(t)&&!t.allocationNumber)?'כן':'לא', t.receiptId?'כן':'לא'
    ]);
  }
  lines.push([]);
  lines.push(['','','','','','סה"כ הכנסות',income.toFixed(2),'','','']);
  lines.push(['','','','','','סה"כ הוצאות',expense.toFixed(2),'','','']);
  lines.push(['','','','','','מאזן',(income-expense).toFixed(2),'','','']);
  const csv=lines.map(r=>r.map(csvEscape).join(',')).join('\r\n');
  downloadBlob(`${filenameBase}.csv`, new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'}));
}

function renderBarChart(rows){
  const width=720, height=220, padL=48, padB=34, padT=14, padR=10;
  const max=Math.max(1, ...rows.map(r=>Math.max(r.income,r.expense)));
  const plotW=width-padL-padR, plotH=height-padT-padB;
  const groupW=plotW/rows.length;
  const barW=Math.max(6, Math.min(24,(groupW-10)/2));
  const scaleY=v=>padT+plotH-(v/max)*plotH;
  const yTicks=[0,0.25,0.5,0.75,1].map(f=>max*f);

  let bars='';
  rows.forEach((r,i)=>{
    const cx=padL+i*groupW+groupW/2;
    const xi=cx-barW-3, xe=cx+3;
    const yi=scaleY(r.income), ye=scaleY(r.expense);
    bars+=`<g>
      <rect x="${xi.toFixed(1)}" y="${yi.toFixed(1)}" width="${barW}" height="${(padT+plotH-yi).toFixed(1)}" rx="3" fill="var(--chart-income)"><title>${esc(r.periodLabel)} — הכנסות: ${fmtMoney(r.income)}</title></rect>
      <rect x="${xe.toFixed(1)}" y="${ye.toFixed(1)}" width="${barW}" height="${(padT+plotH-ye).toFixed(1)}" rx="3" fill="var(--chart-expense)"><title>${esc(r.periodLabel)} — הוצאות: ${fmtMoney(r.expense)}</title></rect>
      <text x="${cx.toFixed(1)}" y="${(height-padB+16).toFixed(1)}" text-anchor="middle" class="chart-axis-label">${esc(r.periodLabel)}</text>
    </g>`;
  });
  const gridLines=yTicks.map(v=>{
    const y=scaleY(v);
    return `<line x1="${padL}" x2="${width-padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" class="chart-grid"/><text x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" class="chart-axis-label">${fmtCompact(v)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${width} ${height}" class="chart-svg" role="img" aria-label="תרשים עמודות המשווה הכנסות מול הוצאות בכל תקופה; פירוט מדויק בטבלה שמתחת">${gridLines}${bars}</svg>`;
}
function renderLineChart(rows){
  const width=720, height=180, padL=48, padB=28, padT=14, padR=10;
  let cum=0;
  const pts=rows.map(r=>{ cum+=r.net; return {periodLabel:r.periodLabel, cum}; });
  const maxAbs=Math.max(1, ...pts.map(p=>Math.abs(p.cum)));
  const plotW=width-padL-padR, plotH=height-padT-padB;
  const scaleX=i=>padL+(pts.length===1?plotW/2:(i/(pts.length-1))*plotW);
  const scaleY=v=>padT+plotH/2-(v/maxAbs)*(plotH/2);
  const path=pts.map((p,i)=>`${i===0?'M':'L'} ${scaleX(i).toFixed(1)} ${scaleY(p.cum).toFixed(1)}`).join(' ');
  const zeroY=scaleY(0);
  const dots=pts.map((p,i)=>`<circle cx="${scaleX(i).toFixed(1)}" cy="${scaleY(p.cum).toFixed(1)}" r="3.5" fill="var(--brand)"><title>${esc(p.periodLabel)}: ${fmtMoney(p.cum)}</title></circle>`).join('');
  const showLabel=(i)=> pts.length<=14 || i%Math.ceil(pts.length/14)===0 || i===pts.length-1;
  const labels=pts.map((p,i)=> showLabel(i) ? `<text x="${scaleX(i).toFixed(1)}" y="${(height-padB+16).toFixed(1)}" text-anchor="middle" class="chart-axis-label">${esc(p.periodLabel)}</text>` : '').join('');
  return `<svg viewBox="0 0 ${width} ${height}" class="chart-svg" role="img" aria-label="תרשים קווי המציג את המאזן המצטבר לאורך זמן; פירוט מדויק בטבלה החודשית שלמעלה">
    <line x1="${padL}" x2="${width-padR}" y1="${zeroY.toFixed(1)}" y2="${zeroY.toFixed(1)}" class="chart-grid-zero"/>
    <path d="${path}" fill="none" stroke="var(--brand)" stroke-width="2"/>
    ${dots}${labels}
  </svg>`;
}

document.getElementById('app').addEventListener('click', async (e)=>{
  const target=e.target.closest('[data-action]');
  if(!target) return;
  const action=target.dataset.action;
  const id=target.dataset.id;
  if(action==='toggle-add-contact'){ state.showAddContact=!state.showAddContact; render(); }
  else if(action==='open-contact'){ state.view='contact'; state.contactId=id; state.showAddTx=false; state.pendingReceiptFile=null; render(); focusRegion(); }
  else if(action==='nav-dashboard'){ state.view='dashboard'; state.contactId=null; render(); }
  else if(action==='nav-reports'){ state.view='reports'; render(); focusRegion(); }
  else if(action==='open-scan'){ state.view='scan'; state.scan=null; render(); focusRegion(); }
  else if(action==='open-batch'){ state.view='batch'; state.batch=null; render(); focusRegion(); }
  else if(action==='scan-cancel'){ cancelScan(); }
  else if(action==='batch-cancel'){ cancelBatch(); }
  else if(action==='batch-skip'){ await skipBatchItem(); }
  else if(action==='delete-contact'){ e.stopPropagation(); await deleteContact(id); }
  else if(action==='toggle-add-tx'){ state.showAddTx=!state.showAddTx; state.pendingReceiptFile=null; render(); }
  else if(action==='set-tx-type'){
    state.txType=target.dataset.type;
    const toggle=target.closest('.type-toggle');
    if(toggle){ toggle.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.type===state.txType)); }
    else render();
  }
  else if(action==='ef-set-type'){
    const scope=target.dataset.scope; const f=activeExtractForm(scope);
    if(f){ f.type=target.dataset.type; const toggle=target.closest('.type-toggle'); if(toggle) toggle.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.type===f.type)); }
  }
  else if(action==='delete-tx'){ await deleteTransaction(id); }
  else if(action==='view-receipt'){ await viewReceipt(id); }
  else if(action==='remove-receipt'){ await removeReceiptFromTx(id); }
  else if(action==='edit-allocation'){ await editAllocationNumber(id); }
  else if(action==='edit-contact'){ state.editContactId=id; render(); }
  else if(action==='cancel-edit-contact'){ state.editContactId=null; render(); }
  else if(action==='open-license'){ state.view='license'; render(); focusRegion(); }
  else if(action==='deactivate-license'){ deactivateLicense(); }
  else if(action==='open-folder'){ state.view='folder'; render(); focusRegion(); }
  else if(action==='choose-folder'){ await chooseWorkFolder(); }
  else if(action==='reconnect-folder'){ await reconnectWorkFolderPermission(); }
  else if(action==='disconnect-folder'){ await disconnectWorkFolder(); }
  else if(action==='sync-folder-now'){ await syncToFolder(); render(); }
  else if(action==='attach-row'){ const inp=target.querySelector('input[type=file]'); if(inp) inp.click(); }
  else if(action==='export-backup'){ await exportBackup(); }
  else if(action==='export-month-csv'){ exportMonthCsv(); }
  else if(action==='export-all-csv'){ exportAllCsv(); }
  else if(action==='trigger-import'){ document.getElementById('importInput').click(); }
});

document.getElementById('app').addEventListener('keydown', async (e)=>{
  if(e.key==='Enter' || e.key===' '){
    const target=e.target.closest('[data-action="view-receipt"]');
    if(target){ e.preventDefault(); await viewReceipt(target.dataset.id); }
  }
});

document.getElementById('app').addEventListener('submit', async (e)=>{
  if(e.target.id==='contactForm'){ e.preventDefault(); await addContact(e.target); }
  else if(e.target.id==='editContactForm'){ e.preventDefault(); await updateContact(state.editContactId, e.target); }
  else if(e.target.id==='txForm'){ e.preventDefault(); await addTransaction(e.target); }
  else if(e.target.id==='scanForm'){ e.preventDefault(); await confirmScan(); }
  else if(e.target.id==='batchItemForm'){ e.preventDefault(); await approveBatchItem(); }
  else if(e.target.id==='splitForm'){ e.preventDefault(); await performImageSplit(); }
  else if(e.target.id==='licenseActivateForm'){
    e.preventDefault();
    const input=document.getElementById('licenseKeyInput');
    await activateLicense(input?input.value:'');
  }
});

document.getElementById('app').addEventListener('input', (e)=>{
  if(e.target.id==='searchInput'){
    state.search=e.target.value; render();
    const el=document.getElementById('searchInput'); el.focus(); el.setSelectionRange(state.search.length,state.search.length);
  }
  else if(e.target.dataset.ef && e.target.tagName!=='SELECT'){
    const f=activeExtractForm(e.target.dataset.scope);
    if(f) f[e.target.dataset.ef]=e.target.value;
    if(e.target.dataset.ef==='amount' || e.target.dataset.ef==='date') updateExtractAllocWarning(e.target.dataset.scope);
  }
  else if(e.target.dataset.split==='count'){ if(state.batch) state.batch.splitCount=Math.max(1,Math.min(20,parseInt(e.target.value,10)||1)); }
  else if(e.target.id==='tf-amount' || e.target.id==='tf-date'){ updateManualAllocWarning(); }
});

document.getElementById('app').addEventListener('change', async (e)=>{
  if(e.target.id==='sortSelect'){ state.sortBy=e.target.value; render(); }
  else if(e.target.id==='reportsScope'){ state.reportsContactId=e.target.value; render(); }
  else if(e.target.id==='exportMonthSelect'){ state.exportMonth=e.target.value; }
  else if(e.target.dataset.ef && e.target.tagName==='SELECT'){
    const f=activeExtractForm(e.target.dataset.scope);
    if(f){ f[e.target.dataset.ef]=e.target.value; render(); }
  }
  else if(e.target.dataset.split==='orientation'){ if(state.batch) state.batch.splitOrientation=e.target.value; }
  else if(e.target.id==='newTxFile'){
    state.pendingReceiptFile=e.target.files[0]||null;
    const label=document.getElementById('newTxAttachLabel');
    if(label) label.textContent=state.pendingReceiptFile?state.pendingReceiptFile.name:'צירוף קבלה (אופציונלי)';
  }
  else if(e.target.dataset.rowFile){ const txId=e.target.dataset.rowFile; const file=e.target.files[0]; if(file) await attachReceiptToRow(txId,file); }
  else if(e.target.id==='scanFileInput'){ const file=e.target.files[0]; if(file) await handleScanFile(file); }
  else if(e.target.id==='batchFileInput'){ const file=e.target.files[0]; if(file) await handleBatchFile(file); }
});

/* drag & drop: per-row attach zones + upload zones (scan/batch) */
document.getElementById('app').addEventListener('dragover',(e)=>{
  const dz=e.target.closest('[data-action="attach-row"]');
  if(dz){ e.preventDefault(); dz.classList.add('drag-over'); return; }
  const uz=e.target.closest('.upload-zone');
  if(uz){ e.preventDefault(); uz.classList.add('drag-over'); }
});
document.getElementById('app').addEventListener('dragleave',(e)=>{
  const dz=e.target.closest('[data-action="attach-row"]');
  if(dz) dz.classList.remove('drag-over');
  const uz=e.target.closest('.upload-zone');
  if(uz) uz.classList.remove('drag-over');
});
document.getElementById('app').addEventListener('drop', async (e)=>{
  const dz=e.target.closest('[data-action="attach-row"]');
  if(dz){ e.preventDefault(); dz.classList.remove('drag-over'); const file=e.dataTransfer.files[0]; if(file) await attachReceiptToRow(dz.dataset.id,file); return; }
  const uz=e.target.closest('.upload-zone');
  if(uz){
    e.preventDefault(); uz.classList.remove('drag-over');
    const file=e.dataTransfer.files[0]; if(!file) return;
    const input=uz.querySelector('input[type=file]');
    if(input && input.id==='scanFileInput') await handleScanFile(file);
    else if(input && input.id==='batchFileInput') await handleBatchFile(file);
  }
});

document.getElementById('importInput').addEventListener('change', async (e)=>{
  const file=e.target.files[0];
  if(file) await importBackup(file);
  e.target.value='';
});

/* ============================= INIT ============================= */
updateLicenseBadge();
updateFolderBadge();
loadAll();
backgroundRecheckLicense();
reconnectWorkFolderOnLoad();

})();
</script>
</body>
</html>
